name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify tag matches manifest.json version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          manifest=$(grep '"version"' manifest.json | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match manifest.json version $manifest"
            exit 1
          fi
          echo "Releasing v$tag"

      - run: npm test

      - name: Build extension zip
        run: bash scripts/build.sh

      - name: Locate built zip
        id: zip
        run: echo "path=$(ls dist/oscar-*.zip)" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: pmnlpaaoigckgocmndipekjbiplkjbea
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: npx -y chrome-webstore-upload-cli@3 upload --source "${{ steps.zip.outputs.path }}" --auto-publish
